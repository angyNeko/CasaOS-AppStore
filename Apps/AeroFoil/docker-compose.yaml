name: aerofoil
services:
  aerofoil:
    container_name: aerofoil
    image: luketanti/aerofoil:latest
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /your/game/directory:/games
      - /your/downloads/directory:/downloads
      - /DATA/AppData/$AppID/config:/app/config
      - /DATA/AppData/$AppID/data:/app/data
      - /DATA/AppData/$AppID/conversion-tmp:/app/conversion-tmp
    ports:
      - "8465:8465"
    restart: unless-stopped
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: "User ID for write permissions"
        - container: PGID
          description:
            en_US: "Group ID for write permissions"
      ports:
        - container: "8465"
          description:
            en_US: "Web Interface Port"
      volumes:
        - container: /games
          description:
            en_US: "Your library games directory"
        - container: /downloads
          description:
            en_US: "Your downloads directory"
        - container: /app/config
          description:
            en_US: "Configuration storage"
        - container: /app/data
          description:
            en_US: "Database and local data"
        - container: /app/conversion-tmp
          description:
            en_US: "Temporary conversion staging"
x-casaos:
  architectures:
    - amd64
    - arm64
  author: luketanti
  category: Media
  description:
    en_US: Personal Library Manager that turns your library into a fully customizable, self-hosted Remote.
  developer: luketanti
  icon: https://raw.githubusercontent.com/luketanti/AeroFoil/master/app/static/icon.png
  id: com.luketanti.aerofoil
  index: /
  main: aerofoil
  port_map: "8465"
  scheme: http
  title:
    custom: AeroFoil
    en_US: AeroFoil